name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests (${{ matrix.os }})
    # The first build compiles Open CASCADE from source.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runs the CAD tests many times slower; there everything is built with
      # optimisation, the same for clippy and the tests so OCCT is compiled once.
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
      # On the Windows runners OCCT's parallel booleans took about 30 times longer than
      # on macOS (38 min for the reference impeller), the threads waiting on each other;
      # there they run on one thread, which costs some 20 % on macOS.
      TP_CAD_SERIAL: ${{ matrix.os == 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # OCCT is restored, built and saved before the tests, so a cancelled test step
      # does not throw the build away.
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-v2-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs', '.cargo/config.toml') }}
      - name: Compilar OCCT
        run: cargo build -p tp-cad
      - name: Guardar la caché de OCCT
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/OCCT
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - run: cargo clippy --workspace --all-targets
      # A limit per step, so that a hang fails here instead of using up the job.
      - name: Tests
        timeout-minutes: 75
        run: cargo test --workspace
      # Parallel against one-thread booleans on a short CAD test, to see what the
      # Windows runners make of OCCT's threads (informational).
      - name: Diagnóstico de OCCT, booleanas en paralelo y en una hebra
        if: runner.os == 'Windows' && !cancelled()
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          for serial in 0 1; do
            start=$(date +%s)
            TP_CAD_SERIAL=$serial cargo test -p tp-cad diffuser::tests::diffuser_solids_are_valid -- --exact
            echo "TP_CAD_SERIAL=$serial: $(( $(date +%s) - start )) s"
          done
      - name: Tests sin CoolProp
        run: cargo test -p tp-fluids --no-default-features
      - name: CLI sin CAD
        run: cargo build -p tp-cli --no-default-features
      # Las pruebas de la interfaz no usan GPU; las capturas con wgpu solo se generan a
      # mano (`cargo test -p tp-gui --test screenshots -- --ignored`).
      - name: Interfaz gráfica sin CAD
        run: cargo build -p tp-gui --no-default-features

  msrv:
    name: Versión mínima de Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-v2-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs', '.cargo/config.toml') }}
      - run: cargo check --workspace --all-targets
