name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests (${{ matrix.os }})
    # The first build compiles Open CASCADE from source.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runs the CAD tests many times slower; there everything is built with
      # optimisation, the same for clippy and the tests so OCCT is compiled once.
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        # The OCCT sources are a git submodule.
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # OCCT is restored, built and saved before the tests, so a cancelled test step
      # does not throw the build away.
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: target/OCCT-8.0.1
          key: occt-8.0.1-v1-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs', 'crates/tp-occt-sys/src/lib.rs', '.cargo/config.toml') }}
      - name: Compilar OCCT
        run: cargo build -p tp-cad
      - name: Guardar la caché de OCCT
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/OCCT-8.0.1
          key: ${{ steps.occt.outputs.cache-primary-key }}
      - run: cargo clippy --workspace --all-targets
      # A limit per step, so that a hang fails here instead of using up the job.
      - name: Tests
        if: runner.os != 'Windows'
        timeout-minutes: 75
        run: cargo test --workspace
      # On the Windows runners OCCT ran 3 to 16 times slower than on macOS depending on
      # the operation (diffuser 20 s, reference impeller 9 min, internal volute 28 min,
      # one test at a time), with the parallel booleans still faster than one thread.
      # The heaviest CAD tests, which Linux and macOS run with the same OCCT code, stay
      # out there; the rest of the CAD tests check that OCCT builds and works on Windows.
      # With OCCT 8.0.1 and the cutwater in 3D, six more passed the 75 minutes there,
      # side by side: the joined fluid 45 min, the volute options 41 min, the cutwater
      # and discharge shapes 22 min, and the double volute (over 70 min), the spiral
      # development options and the rounded groove over the cutwater unfinished.
      - name: Tests (sin las pruebas de CAD más pesadas)
        if: runner.os == 'Windows'
        timeout-minutes: 75
        run: >-
          cargo test --workspace --
          --skip reference_impeller_solids
          --skip an_internal_volute_is_one_solid_with_its_bend
          --skip the_casing_wraps_the_flow_domain_in_one_solid
          --skip volute_channel_and_fluid_domain_are_valid_solids
          --skip cad_exports_impeller_and_flow_domain
          --skip cad_export_writes_both_solids
          --skip the_chambers_join_the_impeller_and_the_volute_in_one_fluid
          --skip common_volute_options_give_one_valid_flow_domain
          --skip cutwater_and_discharge_shapes_give_valid_solids
          --skip a_double_volute_is_one_valid_solid
          --skip spiral_development_options_give_one_valid_flow_domain
          --skip the_casing_fills_and_rounds_the_groove_over_the_cutwater
          --skip back_vanes_join_the_impeller
      - name: Tests sin CoolProp
        run: cargo test -p tp-fluids --no-default-features
      - name: CLI sin CAD
        run: cargo build -p tp-cli --no-default-features
      # Las pruebas de la interfaz no usan GPU; las capturas con wgpu solo se generan a
      # mano (`cargo test -p tp-gui --test screenshots -- --ignored`).
      - name: Interfaz gráfica sin CAD
        run: cargo build -p tp-gui --no-default-features

  msrv:
    name: Versión mínima de Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # The OCCT sources are a git submodule.
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        uses: actions/cache@v4
        with:
          path: target/OCCT-8.0.1
          key: occt-8.0.1-v1-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs', 'crates/tp-occt-sys/src/lib.rs', '.cargo/config.toml') }}
      - run: cargo check --workspace --all-targets
