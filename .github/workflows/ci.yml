name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Tests (${{ matrix.os }})
    # The first build compiles Open CASCADE from source.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs') }}
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Tests sin CoolProp
        run: cargo test -p tp-fluids --no-default-features
      - name: CLI sin CAD
        run: cargo build -p tp-cli --no-default-features

  msrv:
    name: Versión mínima de Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Caché de OCCT (se compila desde el código fuente la primera vez)
        uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-7.8.1-${{ runner.os }}-${{ hashFiles('crates/tp-cad/build.rs') }}
      - run: cargo check --workspace --all-targets
